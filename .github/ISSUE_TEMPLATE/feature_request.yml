name: Feature request
description: Suggest an improvement or a new feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to be able to do?
      description: Describe the goal, not just the mechanism, so we can find the simplest fit.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How do you imagine it working?
      description: Optional. A sketch of the UI or flow, or an add-on that does it well.
  - type: textarea
    id: context
    attributes:
      label: Anything else
